services:
  # Open WebUI - Chat interface that connects to the combined Ghidra+MCP container
  # On first start, auto-creates an admin user (WEBUI_ADMIN_EMAIL/PASSWORD),
  # then auto-discovers all MCP tool servers and binds them to the default model
  # so every new chat has tools available without manual setup.
  # OFFLINE_MODE suppresses the "What's New" modal on login; inference & MCP still work.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.6
    ports:
      - "80:8080"
    environment:
      - OPENAI_API_BASE_URL=${BASE_URL}
      - OPENAI_API_KEY=${API_KEY}
      - ENABLE_OLLAMA_API=False
      - ENABLE_OPENAI_API=True
      - BYPASS_MODEL_ACCESS_CONTROL=True
      - ENABLE_DIRECT_CONNECTIONS=True
      - OFFLINE_MODE=True
      - ENABLE_VERSION_UPDATE_CHECK=False
      - ENABLE_PERSISTENT_CONFIG=False
      - DEFAULT_MODELS=${DEFAULT_MODEL}
      - DEFAULT_MODEL_PARAMS={"function_calling":"native"}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-demo@demo.demo}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-demo}
      - TOOL_SERVER_CONNECTIONS=[{"type":"mcp","url":"http://ghidra-mcp-headless:8091/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"ghidra","name":"ghidra-mcp","description":"Ghidra analysis tools (get_tool/invoke_tool via meta-proxy)"}}]
    depends_on:
      ghidra-mcp-headless:
        condition: service_started
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    # Override CMD to bootstrap tool binding after startup, then hand off to uvicorn.
    # Runs start.sh in background → signs in as admin → discovers all MCP tools →
    # creates/updates a workspace model with every tool ID attached →
    # future MCP servers added to TOOL_SERVER_CONNECTIONS are auto-discovered.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        # Start Open WebUI in the background (start.sh → exec uvicorn)
        echo "Starting Open WebUI..."
        bash start.sh &
        WEBUI_PID=$$!

        # Wait for health check
        echo "Waiting for server to be ready..."
        for i in $$(seq 1 120); do
          if curl -sf http://localhost:$${PORT:-8080}/health > /dev/null 2>&1; then
            echo "Server healthy after $${i}s"
            break
          fi
          sleep 2
        done

        # Wait for the MCP bridge on the Ghidra container to be ready
        MCP_URL=http://ghidra-mcp-headless:8091/mcp
        echo "Waiting for MCP bridge at $${MCP_URL}..."
        for i in $$(seq 1 60); do
          if curl -sf "$${MCP_URL}" -X POST -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > /dev/null 2>&1; then
            echo "MCP bridge ready after $${i}s"
            break
          fi
          sleep 2
        done

        # Bootstrap: sign in, discover MCP tools, bind to the DEFAULT_MODEL
        python3 -c "
        import json, os, urllib.request, sys

        BASE = 'http://localhost:{}'.format(int(os.environ.get('PORT', '8080')))
        ADMIN_EMAIL = os.environ.get('WEBUI_ADMIN_EMAIL', '')
        ADMIN_PW = os.environ.get('WEBUI_ADMIN_PASSWORD', '')
        MODEL_ID = os.environ.get('DEFAULT_MODELS', 'grok-4.3')
        # Also clean up any stale workspace model from a previous iteration
        STALE_MODEL = MODEL_ID + '-mcp'

        if not ADMIN_EMAIL or not ADMIN_PW:
            print('SKIP: WEBUI_ADMIN_EMAIL/PASSWORD not set')
            sys.exit(0)

        # Sign in as admin
        req = urllib.request.Request(
            BASE + '/api/v1/auths/signin',
            data=json.dumps({'email': ADMIN_EMAIL, 'password': ADMIN_PW}).encode(),
            headers={'Content-Type': 'application/json'},
        )
        try:
            resp = json.loads(urllib.request.urlopen(req).read())
            token = resp['token']
            print('Signed in as admin')
        except Exception as e:
            print(f'WARN: Sign in failed: {e} — tools will need manual setup')
            sys.exit(0)

        auth_hdr = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

        # Remove stale workspace model from previous iteration (if exists)
        try:
            req = urllib.request.Request(
                BASE + '/api/v1/models/model/delete',
                data=json.dumps({'id': STALE_MODEL}).encode(), headers=auth_hdr,
            )
            urllib.request.urlopen(req)
            print(f'Cleaned up stale model: {STALE_MODEL}')
        except Exception:
            pass

        # Discover ALL MCP tool servers
        req = urllib.request.Request(BASE + '/api/v1/tools/', headers={'Authorization': f'Bearer {token}'})
        try:
            tools = json.loads(urllib.request.urlopen(req).read())
            mcp_ids = [t['id'] for t in tools if t['id'].startswith('server:mcp:')]
            print(f'Discovered {len(mcp_ids)} MCP tool(s): {mcp_ids}')
        except Exception as e:
            print(f'WARN: Tool discovery failed: {e}')
            mcp_ids = []

        if not mcp_ids:
            print('SKIP: No MCP tools discovered')
            sys.exit(0)

        # Bind tools to the DEFAULT_MODEL via workspace model create/update
        payload = json.dumps({
            'id': MODEL_ID,
            'name': MODEL_ID,
            'meta': {'toolIds': mcp_ids},
            'params': {'function_calling': 'native'},
            'access_grants': [],
        })

        # Try update first (model exists from a previous bootstrap).
        # Then try create (first run), then delete+create (fallback).
        done = False
        for attempt, label, url in [
            (1, 'update', BASE + '/api/v1/models/model/update'),
            (2, 'create', BASE + '/api/v1/models/create'),
            (3, 'delete+create', BASE + '/api/v1/models/create'),
        ]:
            if attempt == 3:
                # Before last attempt, delete the stale entry
                try:
                    req = urllib.request.Request(
                        BASE + '/api/v1/models/model/delete',
                        data=json.dumps({'id': MODEL_ID}).encode(), headers=auth_hdr,
                    )
                    urllib.request.urlopen(req)
                except Exception:
                    pass
            try:
                req = urllib.request.Request(url, data=payload.encode(), headers=auth_hdr)
                resp = json.loads(urllib.request.urlopen(req).read())
                tools_bound = resp.get('meta', {}).get('toolIds', [])
                print('Model {}: {} — tools: {}'.format(label, resp.get('id'), tools_bound))
                done = True
                break
            except urllib.error.HTTPError as e:
                if e.code == 500:
                    err = e.read().decode()
                    print(f'{label} got 500 — skipping: {err[:120]}')
                elif attempt < 3:
                    pass  # Try next method
                else:
                    err = e.read().decode()
                    print(f'WARN: Model {label} failed: HTTP {e.code} {err[:120]}')

        if not done:
            print('WARN: Could not bind tools to model — manual setup may be needed')

        print('Bootstrap complete.')
        "

        # Hand off to the server process
        echo "Entering server loop..."
        wait $$WEBUI_PID

  # ghidra-mcp-headless - Combined Ghidra 12.1 headless REST API + Python MCP bridge
  # + meta-tool proxy (get_tool/invoke_tool). Three processes in one container:
  #   Java REST API (port 8089) → Python MCP bridge (port 8090) → Python meta proxy (port 8091)
  # Clients connect to port 8091 and see only 2 meta-tools instead of 249.
  ghidra-mcp-headless:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${GHIDRA_MCP_HEADLESS_PORT:-3334}:8089"   # REST API (direct access for debugging)
      - "${GHIDRA_MCP_BRIDGE_PORT:-3335}:8090"      # MCP Streamable HTTP endpoint (internal)
      - "${GHIDRA_MCP_PROXY_PORT:-3336}:8091"        # Meta-tool proxy (get_tool/invoke_tool)
    volumes:
      - ./binaries:/binaries:ro
      - ghidra-projects:/projects
    environment:
      - GHIDRA_MCP_PORT=8089
      - GHIDRA_MCP_AUTH_TOKEN=${GHIDRA_MCP_AUTH_TOKEN:-changeme}
      - JAVA_OPTS=-Xmx4g -XX:+UseG1GC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/check_connection"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  open-webui-data:
  ghidra-projects:
