services:
  # Open WebUI - Chat interface that connects to the combined Ghidra+MCP container
  # On first start, auto-creates an admin user (WEBUI_ADMIN_EMAIL/PASSWORD),
  # then auto-discovers all MCP tool servers and binds them to the default model
  # so every new chat has tools available without manual setup.
  # OFFLINE_MODE suppresses the "What's New" modal on login; inference & MCP still work.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.6
    ports:
      - "80:8080"
    environment:
      - OPENAI_API_BASE_URL=${BASE_URL}
      - OPENAI_API_KEY=${API_KEY}
      - ENABLE_OLLAMA_API=False
      - ENABLE_OPENAI_API=True
      - BYPASS_MODEL_ACCESS_CONTROL=True
      - ENABLE_DIRECT_CONNECTIONS=True
      - OFFLINE_MODE=True
      - ENABLE_VERSION_UPDATE_CHECK=False
      - ENABLE_PERSISTENT_CONFIG=False
      - DEFAULT_MODELS=${DEFAULT_MODEL}
      - DEFAULT_MODEL_PARAMS={"function_calling":"native"}
      # Disable built-in system tools (code interpreter, memory, notes, etc.)
      - ENABLE_CODE_INTERPRETER=False
      - ENABLE_CODE_EXECUTION=False
      - ENABLE_MEMORIES=False
      - ENABLE_NOTES=False
      - ENABLE_AUTOMATIONS=False
      - ENABLE_CALENDAR=False
      - OFFLINE_MODE=True
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-demo@demo.demo}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-demo}
      - TOOL_SERVER_CONNECTIONS=[{"type":"mcp","url":"http://ghidra-mcp-headless:8090/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"ghidra","name":"ghidra-mcp","description":"Ghidra binary analysis MCP server (249 tools)"}},{"type":"mcp","url":"http://open-terminal:9000/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"terminal","name":"open-terminal","description":"Terminal MCP server for command execution and file management"}}]
    depends_on:
      ghidra-mcp-headless:
        condition: service_started
    volumes:
      - open-webui-data:/app/backend/data
      - ./docker/open-webui-entrypoint.sh:/docker/open-webui-entrypoint.sh
      - ./docker/open-webui-bootstrap.py:/docker/open-webui-bootstrap.py
    restart: unless-stopped
    command: ["/bin/bash", "/docker/open-webui-entrypoint.sh"]

  # ghidra-mcp-headless - Combined Ghidra 12.1 headless REST API + Python MCP bridge
  # Merges the upstream GhidraMCP headless server (bethington/ghidra-mcp v5.13.1)
  # and its bridge_mcp_ghidra.py into a single container. The Java process serves
  # 195+ REST endpoints for binary analysis on port 8089; the Python process
  # translates them to 249 MCP tools on port 8090.
  ghidra-mcp-headless:
    build:
      context: .
      dockerfile: docker/ghidra.Dockerfile
    ports:
      - "${GHIDRA_MCP_HEADLESS_PORT:-3334}:8089"   # REST API (direct access for debugging)
      - "${GHIDRA_MCP_BRIDGE_PORT:-3335}:8090"      # MCP Streamable HTTP endpoint
    volumes:
      - ${GHIDRA_PROJECTS_FOLDER:-./shared/projects}:/projects
      - ${SHARED_FOLDER:-./shared}:/tmp
    environment:
      - GHIDRA_MCP_PORT=8089
      - GHIDRA_MCP_AUTH_TOKEN=${GHIDRA_MCP_AUTH_TOKEN:-changeme}
      - JAVA_OPTS=-Xmx4g -XX:+UseG1GC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/check_connection"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # open-terminal - Lightweight terminal MCP server for command execution
  # and file management alongside Ghidra analysis. Shares the same
  # SHARED_FOLDER so files imported in Ghidra are accessible here at /shared.
  # API key is static ("demo") since this is for demo/presentation use only.
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    ports:
      - "${OPEN_TERMINAL_MCP_PORT:-9000}:9000"
    volumes:
      - ${SHARED_FOLDER:-./shared}:/home/user/shared
      - ${SHARED_FOLDER:-./shared}/projects:/home/user/projects
    environment:
      - OPEN_TERMINAL_API_KEY=demo
      - OPEN_TERMINAL_PACKAGES=gdb
      - OPEN_TERMINAL_PIP_PACKAGES=fastmcp
    command: ["mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9000"]
    restart: unless-stopped

volumes:
  open-webui-data:
